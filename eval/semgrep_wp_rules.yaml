- id: wisp-wp-csrf
  languages:
  - php
  severity: WARNING
  message: 'WordPress csrf: state change in a function with no nonce check (best-effort Semgrep transplant of WISP missing-guard).'
  metadata:
    wisp-class: csrf
  patterns:
  - pattern-either:
    - pattern: update_option(...)
    - pattern: add_option(...)
    - pattern: delete_option(...)
    - pattern: update_site_option(...)
    - pattern: update_network_option(...)
    - pattern: update_post_meta(...)
    - pattern: add_post_meta(...)
    - pattern: delete_post_meta(...)
    - pattern: update_user_meta(...)
    - pattern: add_user_meta(...)
    - pattern: delete_user_meta(...)
    - pattern: update_term_meta(...)
    - pattern: wp_insert_post(...)
    - pattern: wp_update_post(...)
    - pattern: wp_delete_post(...)
    - pattern: wp_insert_user(...)
    - pattern: wp_create_user(...)
    - pattern: wp_update_user(...)
    - pattern: wp_set_password(...)
    - pattern: wp_insert_comment(...)
    - pattern: wp_update_comment(...)
    - pattern: wp_delete_comment(...)
    - pattern: wp_set_comment_status(...)
    - pattern: wp_insert_term(...)
    - pattern: wp_update_term(...)
    - pattern: wp_delete_term(...)
    - pattern: wp_set_object_terms(...)
    - pattern: wp_set_post_terms(...)
    - pattern: wp_insert_attachment(...)
    - pattern: add_role(...)
    - pattern: remove_role(...)
    - pattern: set_transient(...)
    - pattern: set_site_transient(...)
    - pattern: wp_schedule_event(...)
    - pattern: rename(...)
    - pattern: rmdir(...)
    - pattern: mkdir(...)
    - pattern: $WPDB->insert(...)
    - pattern: $WPDB->update(...)
    - pattern: $WPDB->delete(...)
    - pattern: $WPDB->replace(...)
  - pattern-inside: function $F(...) { ... }
  - pattern-not-inside: function $F(...) { ... wp_verify_nonce(...); ... }
  - pattern-not-inside: function $F(...) { ... if (!wp_verify_nonce(...)) { ... } ... }
  - pattern-not-inside: function $F(...) { ... if (!wp_verify_nonce(...)) $S; ... }
  - pattern-not-inside: function $F(...) { ... check_admin_referer(...); ... }
  - pattern-not-inside: function $F(...) { ... if (!check_admin_referer(...)) { ... } ... }
  - pattern-not-inside: function $F(...) { ... if (!check_admin_referer(...)) $S; ... }
  - pattern-not-inside: function $F(...) { ... check_ajax_referer(...); ... }
  - pattern-not-inside: function $F(...) { ... if (!check_ajax_referer(...)) { ... } ... }
  - pattern-not-inside: function $F(...) { ... if (!check_ajax_referer(...)) $S; ... }
