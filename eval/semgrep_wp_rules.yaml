  - pattern: absint(...)
  - pattern: intval(...)
  - pattern: floatval(...)
  - pattern: boolval(...)
  - pattern: is_numeric(...)
  - pattern: ctype_digit(...)
  - pattern: number_format(...)
  - pattern: zeroise(...)
  - pattern: sanitize_text_field(...)
  - pattern: sanitize_key(...)
  - pattern: sanitize_email(...)
  - pattern: filter_var(...)
  - pattern: json_encode(...)
  - pattern: md5(...)
  - pattern: sha1(...)
  - pattern: hash(...)
  - pattern: wp_hash(...)
  - pattern: preg_quote(...)
  pattern-sinks:
  - pattern: echo $SINK;
    focus-metavariable: $SINK
